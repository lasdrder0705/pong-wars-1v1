plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pongwars.onevone'
    compileSdk 36

    defaultConfig {
        applicationId "com.pongwars.onevone"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.0'
}
